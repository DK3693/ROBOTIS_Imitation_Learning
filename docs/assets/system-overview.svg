<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">ROBOTIS Imitation Learning system architecture</title>
<desc id="desc">Three RGB views, language and named right-arm state feed X-VLA. A 30 by 8 action chunk is mapped to preview or physical robot execution.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#143b4b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#4bd6bd"/></marker></defs>
<rect width="1400" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="65" font-family="Arial, sans-serif" font-size="16" fill="#4bd6bd" font-weight="700">ROBOTIS / IMITATION LEARNING</text>
<text x="55" y="118" font-family="Arial, sans-serif" font-size="38" fill="#ffffff" font-weight="700">From demonstrations to real-robot manipulation</text>
<text x="55" y="160" font-family="Arial, sans-serif" font-size="15" fill="#a9becd">MULTI-VIEW PERCEPTION  /  NAMED JOINT CONTRACT  /  ARM64 POLICY EXECUTION</text>
<rect x="55" y="225" width="355" height="235" rx="15" fill="#173143" stroke="#34566b"/>
<text x="77" y="263" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">OBSERVATION</text>
<text x="77" y="303" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">3 RGB views + task instruction</text>
<text x="77" y="334" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Right head / wrist + left head</text>
<text x="77" y="365" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Named state: 7 joints + gripper</text>
<text x="77" y="396" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">50 demos / 22,012 frames</text>
<rect x="522" y="225" width="355" height="235" rx="15" fill="#173143" stroke="#34566b"/>
<text x="544" y="263" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">X-VLA POLICY</text>
<text x="544" y="303" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Pretrained backbone / BF16</text>
<text x="544" y="334" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Saved pre- and postprocessors</text>
<text x="544" y="365" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Action chunk: 30 x 8</text>
<text x="544" y="396" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">RTX 3090 training / Orin inference</text>
<rect x="989" y="225" width="355" height="235" rx="15" fill="#173143" stroke="#34566b"/>
<text x="1011" y="263" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">ROBOT EXECUTION</text>
<text x="1011" y="303" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Cyclo Core + Worker</text>
<text x="1011" y="334" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Right-arm action routing</text>
<text x="1011" y="365" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Command-gated 3D preview</text>
<text x="1011" y="396" font-family="Arial, sans-serif" font-size="19" fill="#dce9f2">Physical pick-and-place demo</text>
<path d="M 420 340 H 508" stroke="#4bd6bd" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 887 340 H 975" stroke="#4bd6bd" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="560" font-family="Arial, sans-serif" font-size="44" fill="#4bd6bd" font-weight="700">8D</text>
<text x="55" y="596" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">STATE + ACTION CONTRACT</text>
<text x="500" y="560" font-family="Arial, sans-serif" font-size="44" fill="#4bd6bd" font-weight="700">7.9%</text>
<text x="500" y="596" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">LOWER VALIDATION LOSS*</text>
<text x="945" y="560" font-family="Arial, sans-serif" font-size="44" fill="#4bd6bd" font-weight="700">250</text>
<text x="945" y="596" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">PROTECTED FILES VERIFIED</text>
<text x="55" y="665" font-family="Arial, sans-serif" font-size="16" fill="#a9becd">* Vision freeze vs. baseline / 6,000 steps / seed 42. Offline metric, distinct from the robot demonstration.</text>
</svg>